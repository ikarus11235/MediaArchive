version: '3.8'
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sql-server-container
    volumes:
      - mssql-data:/var/opt/mssql
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: Y
    ports:
      - "1433:1433"     # 0.0.0.0:1433
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mediacontroller:
    image: mediacontroller
    container_name: mediacontroller
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5203

      # appsettings.json => ConnectionStrings:DefaultConnection
      ConnectionString: >
        Server=mssql,1433;
        Database=MediaArchive;
        User Id=sa;
        Password=${SA_PASSWORD};
        TrustServerCertificate=True;
    ports:
      - "5203:5203"

  frontend:
    image: mediaarchive-angular
    container_name: mediaarchive-angular
    ports:
      - "4200:80"
    volumes:
      - ./media-archive-frontend/public:/usr/share/nginx/html/public

volumes:
  mssql-data: