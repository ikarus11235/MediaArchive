<div class="login-container">
  <div class="login-card">
    <h1>MediaArchive</h1>
    <h2>Login</h2>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email"
          [(ngModel)]="user.email" 
          name="email" 
          placeholder="your@email.com"
          required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password"
          [(ngModel)]="user.password" 
          name="password" 
          placeholder="••••••••"
          required>
      </div>

      <button type="submit" class="login-btn">Login</button>
    </form>

    <p class="message" [class.error]="message.includes('Invalid')">{{ message }}</p>
  </div>
</div>
