<button class="button" (click)="openDialog()">
    Neuer Header
</button>

<app-header-dialog-component
    *ngIf="showDialog"
    (cancel)="closeDialog()"
    (save)="createHeader($event)">
</app-header-dialog-component>

<div class="headers">
  <div *ngFor="let header of displayedHeaders">
    <app-header-tile [title]="header.title" [thumbNailPath]="header.thumbNailPath" [headerId]="header.id"></app-header-tile>
    
  </div>
</div>
