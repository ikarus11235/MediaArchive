<div>
  <button class="button" (click)="navigateToSeasons(displayedEpisode.seasonId)">Back</button>
</div>

<video width="100%" height="700px" controls *ngIf="displayedEpisode">
  <source [src]="displayedEpisode.videoPath">
Your browser does not support the video tag.
</video>
<h1 *ngIf="displayedEpisode">{{displayedEpisode.title}}</h1>
<h2 *ngIf="dispayedPictures" (click)="navigateToGallery(displayedEpisode.id)">Pictures:</h2>
<div class="pictures" *ngIf="dispayedPictures">
  <div *ngFor="let picture of dispayedPictures">
    <img [src]="picture.imagePath" alt="Alt">
  </div>
</div>
