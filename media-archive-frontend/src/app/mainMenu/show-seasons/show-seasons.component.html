<div>
  <button class="button" (click)="navigateToHeaders()">Back</button>
  <button class="button" (click)="showSeasonDialog = true">
  Neue Season
</button>
</div>

<app-season-dialog
    *ngIf="showSeasonDialog"
    (cancel)="closeSeasonDialog()"
    (save)="createSeason($event)">
</app-season-dialog>

<h1>{{displayedTitle}}</h1>

<div class="dropdown">
  <button class="dropbtn">Seasons</button>

  <div class="dropdown-content">
    <a *ngFor="let season of displayedSeasons">
      <span (click)="renderEpisodes(season.id)">{{ season.title }}</span>
    </a>
  </div>
</div>

<div class="episodeList">
  <div class="episodeTiles" *ngFor="let episode of displayedEpisodes">
    <app-episode-tile [title]="episode.title" [episodeSign]="episode.episodeSign" [id]="episode.id"></app-episode-tile>
  </div>
</div>
