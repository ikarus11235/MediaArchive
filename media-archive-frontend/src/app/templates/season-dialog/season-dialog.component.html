<div class="backdrop">

  <div class="dialog">

    <h2>Staffel erstellen</h2>
    
    <form (ngSubmit)="onSave()">
      <div class="form-group">
        <label for="season-title">Staffelname:</label>
        <input 
          type="text" 
          id="season-title"
          [(ngModel)]="title" 
          name="title"
          placeholder="z.B. Staffel 1"
          required>
      </div>

      <div class="form-group">
        <label for="episodes">Episoden-Dateien:</label>
        <input 
          type="file" 
          id="episodes"
          multiple
          accept="video/*"
          (change)="onFilesSelected($event)"
          class="file-input">
        <p class="file-info" *ngIf="selectedFiles.length > 0">
          {{ selectedFiles.length }} Datei(en) ausgewählt
        </p>
      </div>

      <div class="button-group">
        <button type="button" class="btn btn-secondary" (click)="cancel.emit()">Abbrechen</button>
        <button type="submit" class="btn btn-primary">Speichern</button>
      </div>
    </form>

  </div>

</div>
