<div class="backdrop">

    <div class="dialog">

        <h2>Serie erstellen</h2>
        
        <form (ngSubmit)="onSave()">
            <div class="form-group">
                <label for="title">Seriename:</label>
                <input 
                    type="text" 
                    id="title"
                    [(ngModel)]="title" 
                    name="title"
                    placeholder="Name of the show"
                    required>
            </div>

            <div class="form-group">
                <label for="thumbnail">Thumbnail hochladen:</label>
                <input 
                    type="file" 
                    id="thumbnail"
                    accept="image/*"
                    (change)="onFileSelected($event)"
                    class="file-input">
                <p class="file-info" *ngIf="selectedFile">
                    {{ selectedFile.name }}
                </p>
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-secondary" (click)="cancel.emit()">Abbrechen</button>
                <button type="submit" class="btn btn-primary">Speichern</button>
            </div>
        </form>

    </div>

</div>
